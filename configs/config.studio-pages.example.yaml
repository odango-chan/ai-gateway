# GitHub Pages Skill Studio + this machine's Gateway (local/WSL profile).
# Only this public template is shipped. Never commit or distribute real keys.
# Pages project URL: https://odango-chan.github.io/ca-skill-studio-demo/
# Browser Origin header contains only scheme + host, without the project path.
server:
  listen: "127.0.0.1:8787"
  allow_remote: false
  cors_allowed_origins:
    - "https://odango-chan.github.io"

# Conservative limits for personal authoring, not a public shared API.
limits:
  max_request_bytes: 1048576
  max_concurrent: 4
  dial_timeout: 10s
  response_header_timeout: 120s
  idle_conn_timeout: 90s
  shutdown_timeout: 10s

upstreams:
  opencode-go:
    base_url: "https://opencode.ai/inference/go"
    headers:
      # Required: export OPENCODE_GO_API_KEY before starting.
      # Gateway injects it into upstream requests. Pages never receives it.
      Authorization: "Bearer ${OPENCODE_GO_API_KEY}"
