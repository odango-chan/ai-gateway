name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        type: string
      source_sha:
        description: "Full 40-character main commit SHA to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full commit SHA is required"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "Checkout differs from source SHA"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || { echo "Source is not an ancestor of main"; exit 1; }
          if git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" | grep -q .; then
            echo "Release tag already exists; refusing to retarget it"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          BINARY_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p staging dist
          go build -trimpath -ldflags="-s -w" -o "staging/ai-gateway${BINARY_EXT}" ./cmd/ai-gateway
          cp LICENSE README.md README.zh-CN.md SECURITY.md CONTRIBUTING.md staging/
          mkdir -p staging/configs
          cp configs/config.example.yaml staging/configs/config.example.yaml
          cp -R docs scripts staging/
          if [ "$GOOS" = "windows" ]; then
            (cd staging && zip -q -r "../dist/ai-gateway-${GOOS}-${GOARCH}.zip" .)
          else
            tar -C staging -czf "dist/ai-gateway-${GOOS}-${GOARCH}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || { echo "Source revision mismatch"; exit 1; }
            if git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" | grep -q .; then
              echo "Release tag already exists; refusing duplicate publication"
              exit 1
            fi
            gh release create "$RELEASE_VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "$RELEASE_VERSION" --target "$SOURCE_SHA" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
