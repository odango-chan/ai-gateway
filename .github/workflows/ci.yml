name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate Windows launcher syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/start-studio-pages.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors -join '; ') }

  release-layout:
    name: Validate release archive layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public example payload
        run: |
          set -euo pipefail
          mkdir -p staging/configs
          cp configs/*.example.yaml staging/configs/
          cp -R docs scripts staging/
          tar -czf payload.tar.gz -C staging .
          tar -tzf payload.tar.gz | grep -Fx './configs/config.studio-pages.example.yaml'
          tar -tzf payload.tar.gz | grep -Fx './scripts/start-studio-pages.sh'
          tar -tzf payload.tar.gz | grep -Fx './scripts/start-studio-pages.ps1'
          tar -tzf payload.tar.gz | grep -Fx './docs/browser-studio.md'
          test ! -e staging/.env
          test ! -e staging/config.yaml

  studio-pages-preview:
    name: Build WSL/Linux Studio Pages preview archive
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Assemble Linux amd64 archive for browser acceptance
        run: |
          set -euo pipefail
          mkdir -p staging/configs dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o staging/ai-gateway ./cmd/ai-gateway
          cp LICENSE README.md README.zh-CN.md SECURITY.md CONTRIBUTING.md staging/
          cp configs/*.example.yaml staging/configs/
          cp -R docs scripts staging/
          test -s staging/configs/config.studio-pages.example.yaml
          test -s staging/scripts/start-studio-pages.sh
          tar -C staging -czf dist/ai-gateway-linux-amd64-studio-preview.tar.gz .
          tar -tzf dist/ai-gateway-linux-amd64-studio-preview.tar.gz | grep -Fx './ai-gateway'
          tar -tzf dist/ai-gateway-linux-amd64-studio-preview.tar.gz | grep -Fx './configs/config.studio-pages.example.yaml'
      - uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-linux-amd64-studio-preview
          path: dist/ai-gateway-linux-amd64-studio-preview.tar.gz
          if-no-files-found: error
          retention-days: 7

  cross-build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: mkdir -p dist && go build -trimpath -o "dist/ai-gateway-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/ai-gateway

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test -race ./...
      - name: Check smoke and launch script syntax
        run: bash -n scripts/smoke-opencode-go.sh scripts/start-studio-pages.sh
