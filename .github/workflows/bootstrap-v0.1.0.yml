name: Dispatch approved v0.1.0 release (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v0.1.0.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Start pinned Release workflow
    if: github.repository == 'odango-chan/ai-gateway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pinned release source and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: v0.1.0
          SOURCE_SHA: 6aaf677c69d7913cb84fe1acfb95c504f7e891df
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD || { echo "Approved release source is no longer on main"; exit 1; }
          if git ls-remote --tags origin "refs/tags/$RELEASE_VERSION" | grep -q .; then
            echo "Release tag already exists; refusing duplicate publication"
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing duplicate publication"
            exit 1
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "version=$RELEASE_VERSION" -f "source_sha=$SOURCE_SHA"
          echo "Dispatched $RELEASE_VERSION from $SOURCE_SHA"
