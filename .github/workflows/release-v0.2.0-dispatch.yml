name: Dispatch Gateway v0.2.0 release once

# One-off audited bridge: GitHub connector cannot call workflow_dispatch.
# Once v0.2.0 is published and verified, delete this workflow via a cleanup PR.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.2.0-dispatch.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: ai-gateway-v0.2.0-dispatch-once
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch pinned released-source workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source and request scope
        env:
          RELEASE_TAG: v0.2.0
          RELEASE_SOURCE_SHA: 521ce5f51a9bcf0d82dfa1efc295e68f85cab900
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          git cat-file -e "$RELEASE_SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" HEAD
          # This dispatch-only merge must not silently replace the tested
          # source with implementation changes made after acceptance.
          changed="$(git diff --name-only "$RELEASE_SOURCE_SHA" HEAD)"
          test "$changed" = ".github/workflows/release-v0.2.0-dispatch.yml" || {
            echo "Unexpected source changes after accepted SHA:"
            printf '%s\n' "$changed"
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; will not dispatch duplicate workflow"
            exit 0
          fi
      - name: Dispatch existing Release workflow for the accepted commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.0
          RELEASE_SOURCE_SHA: 521ce5f51a9bcf0d82dfa1efc295e68f85cab900
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing duplicate publication"
            exit 1
          fi
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "version=$RELEASE_TAG" \
            -f "source_sha=$RELEASE_SOURCE_SHA"
          echo "Triggered pinned Release workflow; this dispatch is not proof of publication."
